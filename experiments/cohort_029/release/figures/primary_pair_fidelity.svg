<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Cohort 029 target pair fidelity</title><desc id="desc">Causal 128 of 512; arithmetic 146 of 512.</desc><rect width="960" height="540" fill="#fff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1c2733}.heading{font-size:26px;font-weight:700}.sub{font-size:17px}.tick{font-size:15px}.label{font-size:19px;font-weight:600}.note{font-size:14px;fill:#4b5661}</style><text class="heading" x="45" y="65">Target pair fidelity</text><text class="sub" x="45" y="98">Transfer form · 512 scheduled pairs per task</text><line x1="250" y1="405" x2="850" y2="405" stroke="#263744"/><line x1="250" y1="405" x2="250" y2="413" stroke="#263744"/><text class="tick" x="244" y="438">0%</text><line x1="400" y1="405" x2="400" y2="413" stroke="#263744"/><text class="tick" x="394" y="438">10%</text><line x1="550" y1="405" x2="550" y2="413" stroke="#263744"/><text class="tick" x="544" y="438">20%</text><line x1="700" y1="405" x2="700" y2="413" stroke="#263744"/><text class="tick" x="694" y="438">30%</text><line x1="850" y1="405" x2="850" y2="413" stroke="#263744"/><text class="tick" x="844" y="438">40%</text><text class="label" x="45" y="247">Causal</text><rect x="250" y="220" width="375.000" height="45" fill="#1d667e"/><text class="label" x="637.000" y="249">128/512 (25.00%)</text><text class="label" x="45" y="357">Arithmetic</text><rect x="250" y="330" width="427.734" height="45" fill="#ad6025"/><text class="label" x="689.734" y="359">146/512 (28.52%)</text><text class="note" x="45" y="490">Pair success requires both target variants to be correct.</text></svg>
